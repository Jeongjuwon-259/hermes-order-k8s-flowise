---
# roles/sealed-secrets — 시크릿을 평문 대신 SealedSecret으로 git에 커밋할 수 있게 하는 컨트롤러
# 채택 이유: 홈랩/솔로 규모엔 External Secrets Operator(외부 Vault 필요)나
# SOPS(KMS/PGP 키 관리 필요)보다 Sealed Secrets가 외부 의존성 없이 가장 단순함 (배경: HISTORY.md §3).
# helm.sh/sealed-secrets 는 프로젝트 공식 차트 저장소(bitnami-labs.github.io)를 그대로 사용 —
# Postgres 때 문제였던 "Bitnami 범용 앱 카탈로그(docker.io/bitnami)"와는 무관한 별개 프로젝트.

- name: Sealed Secrets Helm 저장소 등록
  ansible.builtin.command: helm repo add sealed-secrets https://bitnami-labs.github.io/sealed-secrets
  when: inventory_hostname in groups['control_plane']
  register: ss_repo_add
  changed_when: "'has been added' in ss_repo_add.stdout"
  failed_when:
    - ss_repo_add.rc != 0
    - "'already exists' not in ss_repo_add.stderr"

- name: Helm 저장소 갱신
  ansible.builtin.command: helm repo update
  when: inventory_hostname in groups['control_plane']
  changed_when: false

- name: kube-system에 Sealed Secrets 컨트롤러 설치
  ansible.builtin.command: >
    helm upgrade --install sealed-secrets sealed-secrets/sealed-secrets
    -n kube-system
    --kubeconfig /etc/kubernetes/admin.conf
    --wait
  when: inventory_hostname in groups['control_plane']
  register: ss_install
  changed_when: "'has been upgraded' in ss_install.stdout or 'has been installed' in ss_install.stdout"

- name: 사용법 출력 (Mac mini에서 kubeseal로 시크릿 암호화 시 참고)
  ansible.builtin.debug:
    msg: >
      Sealed Secrets 컨트롤러 설치됨. Mac mini에 kubeseal CLI 설치 후:
      kubeseal --fetch-cert --controller-name=sealed-secrets --controller-namespace=kube-system
      --kubeconfig=/home/admin/.kube/config > pub-cert.pem
      로 공개키를 받아 로컬에서 오프라인으로 SealedSecret 생성 가능
  when: inventory_hostname in groups['control_plane']
