---
# roles/common — clone된 VM의 identity 정리(최우선) + containerd/kubeadm 설치 기반 작업
# identity 재발급이 최우선인 이유: 0-infra의 machine-id 중복 사고
# (0-infra/TROUBLESHOOTING_NOTES.md) 재발 방지 — hostname/SSH host key도 clone 시 복제되므로
# kubeadm join·Ansible 자체의 노드 식별에 영향을 주기 전에 먼저 정리한다.

- name: 이 노드의 hostname을 인벤토리 이름과 일치시킴
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: /etc/hosts에 클러스터 전체 노드 등록
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '.*\s{{ item }}$'
    line: "{{ hostvars[item].ansible_host }} {{ item }}"
    state: present
  loop: "{{ groups['all'] }}"

- name: 기존 SSH host key 삭제 (clone으로 복제된 키 제거)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/ssh/ssh_host_rsa_key
    - /etc/ssh/ssh_host_rsa_key.pub
    - /etc/ssh/ssh_host_ecdsa_key
    - /etc/ssh/ssh_host_ecdsa_key.pub
    - /etc/ssh/ssh_host_ed25519_key
    - /etc/ssh/ssh_host_ed25519_key.pub
  register: ssh_host_keys_removed

- name: 고유한 SSH host key 재생성
  ansible.builtin.command: ssh-keygen -A
  when: ssh_host_keys_removed.results | selectattr('changed') | list | length > 0

- name: SSH 데몬 재시작 (새 host key 적용)
  ansible.builtin.systemd:
    name: ssh
    state: restarted
  when: ssh_host_keys_removed.results | selectattr('changed') | list | length > 0

- name: apt 패키지 캐시 갱신
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: containerd 설치
  ansible.builtin.apt:
    name: containerd
    state: present

- name: containerd 기본 설정 생성 여부 확인
  ansible.builtin.stat:
    path: /etc/containerd/config.toml
  register: containerd_config

- name: /etc/containerd 디렉토리 생성 (패키지 설치만으론 없을 수 있음)
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"
  when: not containerd_config.stat.exists

- name: containerd 기본 설정 생성
  ansible.builtin.shell: containerd config default | tee /etc/containerd/config.toml
  when: not containerd_config.stat.exists

- name: containerd 서비스 시작 + 부팅 시 자동 시작
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true

- name: containerd systemd cgroup driver 활성화 (kubeadm 권장 설정)
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  notify: restart containerd

- name: 필요한 커널 모듈 영구 로드 설정
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"

- name: 커널 모듈 즉시 로드
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: 브릿지 네트워크 sysctl 영구 설정
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
    mode: "0644"

- name: sysctl 설정 즉시 적용
  ansible.builtin.command: sysctl --system
  changed_when: false

- name: /etc/apt/keyrings 디렉토리 생성
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Kubernetes apt 저장소 GPG 키 등록
  ansible.builtin.shell: >
    curl -fsSL https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key
    | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: Kubernetes apt 저장소 등록
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/ /"
    filename: kubernetes
    state: present

- name: kubeadm/kubelet/kubectl 설치
  ansible.builtin.apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
    update_cache: true

- name: kubeadm/kubelet/kubectl 버전 고정 (의도치 않은 업그레이드 방지)
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

- name: kubelet 서비스 활성화 (kubeadm init/join 전까지는 crashloop이 정상)
  ansible.builtin.systemd:
    name: kubelet
    enabled: true

- name: swap 비활성화 (kubeadm 요구사항)
  ansible.builtin.shell: swapoff -a
  changed_when: false

- name: fstab에서 swap 항목 제거 (재부팅 후에도 비활성 유지)
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'
