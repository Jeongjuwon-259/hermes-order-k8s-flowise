# 1-cluster/ansible 공통 변수
# 버전들은 확인된 최신 안정 버전으로 pin — 재실행 시점에 최신 여부 재확인 권장 (pin 배경: HISTORY.md §3).

ansible_user: admin
ansible_password: admin      # Tart 공식 이미지 기본 계정(admin/admin) — 운영 전 교체 권장 (0-infra와 동일)
ansible_become_password: admin
ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

pod_network_cidr: 10.244.0.0/16    # 물리 LAN(192.168.0.0/24)과 겹치지 않도록 확정 (README.md §9 참고)
service_cidr: 10.96.0.0/12         # kubeadm 기본값 그대로 사용

k8s_version: "1.37"                # pkgs.k8s.io repo 경로용 (core:/stable:/v{{ k8s_version }})
calico_version: "v3.32.2"
metallb_version: "v0.16.1"
argocd_version: "stable"           # ArgoCD 공식 권장 설치 채널(stable 브랜치 매니페스트)

metallb_ip_range: "192.168.0.206-192.168.0.239"   # .200~.205는 VM 전용 예약, .240~.254는 향후용 여유
argocd_nodeport: 30080             # 웹 UI HTTP 접근용, 내부(LAN) 전용

gateway_api_version: "v1.6.2"      # kubernetes-sigs/gateway-api, standard channel
istio_version: "1.30.4"            # Helm 차트 버전(app version과 동일 태그 사용, 2026-09-21 기준 istio repo 최신 안정판 — 1.31.0은 미존재)
# sealed-secrets는 helm repo 최신을 그대로 사용 (버전 미고정 — 컨트롤러라 앱처럼 자주 안 바뀜)

control_plane_host: node-1
