# garmin 프로젝트 차트 기본값 — 실제 배포 시 argocd-values/app/garmin-mcp-values.yaml로 override됨
replicaCount: 1

image:
  repository: garmin_mcp
  tag: latest
  pullSecret: ""

service:
  port: 8080

route:
  enabled: false
  hostnames: []

destinationRule:
  enabled: false
  trafficPolicy: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

env:
  - name: GARMIN_TOKEN_DIR
    value: "/root/.garminconnect"

sealedSecrets: []
