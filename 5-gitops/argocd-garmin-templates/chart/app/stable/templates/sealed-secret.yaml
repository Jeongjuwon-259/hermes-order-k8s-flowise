# argocd-project-templates의 sealed-secret.yaml과 같은 규약 (README.md §10 결정 로그 참고)
# encryptedData는 kubeseal로 오프라인 생성한 값을 argocd-values/app/garmin-mcp-values.yaml의
# sealedSecrets에 붙여넣는 방식. 봉인 절차: argocd-garmin-templates/seal-garmin-secret.sh
#
# ⚠️ SealedSecret 기본 scope는 strict — 봉인할 때 쓴 이름·네임스페이스(garmin)가
#    여기서 배포되는 것과 다르면 컨트롤러가 복호화하지 못한다.
{{- range .Values.sealedSecrets }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .name }}
spec:
  encryptedData:
    {{- toYaml .encryptedData | nindent 4 }}
  template:
    metadata:
      name: {{ .name }}
    type: {{ .type | default "Opaque" }}
{{- end }}
