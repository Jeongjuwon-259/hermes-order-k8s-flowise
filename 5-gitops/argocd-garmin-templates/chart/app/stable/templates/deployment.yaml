apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      {{- if .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      {{- end }}
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: Never  # 로컬 빌드 이미지 (사설 레지스트리 없이 노드에서 직접 빌드)
          ports:
            - containerPort: {{ .Values.service.port | default 8080 }}
          {{- if .Values.env }}
          env:
            {{- range .Values.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          {{- end }}
          {{- if .Values.envFromSecrets }}
          # Secret의 모든 키가 환경변수로 들어간다.
          #   MCP_AUTH_TOKENS : /mcp Bearer 토큰 (없으면 서버가 기동을 거부한다)
          #   GARMINTOKENS    : garmin_tokens.json 원본 JSON 문자열 (base64 아님)
          envFrom:
            {{- range .Values.envFromSecrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          # /health는 Garmin을 호출하지 않고 인증도 면제된다. 도구가 동기 함수라 Garmin 호출 중에는
          # 응답이 늦어질 수 있으므로 timeout을 5초로 둔다 (소스 레포 README "원격 실행" 참고).
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port | default 8080 }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port | default 8080 }}
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
