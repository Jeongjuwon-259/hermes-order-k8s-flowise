# garmin MCP 서버 배포 값 — argocd-defaults/README.md §4 참고
# ⚠️ 초안 — 아직 sync 검증 안 됨
#
# argocd-garmin-templates 차트에는 values.yaml이 없다 — 이 파일이 유일한 값 소스.
# (차트 기본값과 이 override가 100% 중복되던 문제를 해소하기 위해 차트 쪽 values.yaml 삭제)

project: garmin

replicaCount: 1

image:
  repository: garmin_mcp
  tag: latest
  pullSecret: ""

service:
  port: 8000  # garmin-mcp-http 기본 포트 (MCP_PORT, README.md "원격 실행" 참고)

route:
  enabled: false
  hostnames: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

env:
  - name: GARMIN_TOKEN_DIR
    value: "/root/.garminconnect"
  # ⚠️ 임시 — Secret 없이 파이프라인(빌드→배포→기동)만 먼저 검증하는 동안만 사용한다.
  #    소스 레포의 garmin-mcp-http는 MCP_AUTH_TOKENS가 없으면 기동을 거부(fail-closed)하므로,
  #    명시적으로 인증을 끈다. 이 상태에서는 /mcp가 인증 없이 열려 있다 (Service는 ClusterIP, route 비활성이라
  #    클러스터 내부에서만 접근 가능). Garmin 토큰(GARMINTOKENS)도 없어서 /health와 MCP 프로토콜
  #    (initialize, tools/list)은 되지만 Garmin 데이터를 가져오는 도구는 인증 오류가 난다.
  #    Secret을 붙일 때(아래 envFromSecrets 참고) 이 항목을 삭제할 것.
  - name: MCP_AUTH_DISABLED
    value: "true"

# Secret을 Deployment에 envFrom으로 주입한다 (Secret 이름 목록).
# 지금은 비워 둔다 (Secret 단계는 나중에). 켤 때:
#   1) 아래 sealedSecrets에 봉인값 붙여넣기  2) envFromSecrets에 garmin-mcp-secret 추가
#   3) 위 env의 MCP_AUTH_DISABLED 삭제
# ⚠️ 봉인값 없이 2)만 하면 Secret이 없어서 새 파드가 시작되지 못한다 (기존 파드는 유지됨).
# (토큰이 설정되면 MCP_AUTH_DISABLED=true여도 인증은 강제된다 — 그래도 3)에서 지울 것)
envFromSecrets: []
# envFromSecrets:
#   - garmin-mcp-secret

# 이 Secret의 키 2개:
#   MCP_AUTH_TOKENS : /mcp Bearer 토큰 (쉼표로 여러 개, 각 24자 이상)
#   GARMINTOKENS    : ~/.garminconnect/garmin_tokens.json 의 원본 JSON 문자열 (base64 아님)
# 봉인: argocd-garmin-templates/seal-garmin-secret.sh 로 encryptedData를 만들어 붙여넣는다.
# 이름(garmin-mcp-secret)과 네임스페이스(garmin)는 봉인 시점과 같아야 한다 (strict scope).
sealedSecrets: []
# sealedSecrets:
#   - name: garmin-mcp-secret
#     type: Opaque
#     encryptedData:
#       MCP_AUTH_TOKENS: AgBy...   # kubeseal --raw 출력
#       GARMINTOKENS: AgBy...      # kubeseal --raw 출력 (원본 JSON을 봉인)
