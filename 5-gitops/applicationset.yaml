# 5-gitops/applicationset.yaml
# ArgoCD v3.5.3 list generator metadata.name에 template 변수 사용 불가.
# 각 ApplicationSet당 하나의 element만, metadata.name은 고정값.
# 새 앱을 추가하려면 별도 ApplicationSet YAML 파일을 하나 추가하면 된다.

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hello-world-appset
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - appName: hello-world
            project: hello-world
  template:
    metadata:
      name: hello-world
    spec:
      project: default
      source:
        repoURL: https://github.com/Jeongjuwon-259/hermes-order-k8s-flowise.git
        targetRevision: main
        path: 5-gitops/argocd-hello-world-templates/chart/app/stable
        helm:
          valueFiles:
            - 5-gitops/argocd-values/app/hello-world.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: hello-world
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
---
# garmin ApplicationSet
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: garmin-appset
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - appName: garmin-mcp
            project: garmin
  template:
    metadata:
      name: garmin-mcp
    spec:
      project: default
      source:
        repoURL: https://github.com/Jeongjuwon-259/hermes-order-k8s-flowise.git
        targetRevision: main
        path: 5-gitops/argocd-garmin-templates/chart/app/stable
        helm:
          valueFiles:
            - 5-gitops/argocd-values/app/garmin-mcp-values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: garmin
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
