# 5-gitops/applicationset.yaml
# argocd-values/app/*.yaml 파일이 추가될 때마다 ArgoCD Application을 자동 생성.
# 2026-09-22: ArgoCD v3.5.3 list generator는 metadata.name에 template 변수를 지원하지 않음.
#  workaround — 각 Application에 고유한 고정 name을 부여, namespace만 variable.
#
#  구조:
#    5-gitops/argocd-<project>-templates/chart/app/stable  (차트)
#    5-gitops/argocd-values/app/<project>.yaml             (값 파일)
#
#  새 앱을 추가하려면:
#    1. 5-gitops/argocd-values/app/<project>.yaml 추가
#    2. (선택) 5-gitops/argocd-<project>-templates 추가
#    3. elements에 하나 추가

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: app-stack
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - appName: hello-world
            project: hello-world
            chartPath: 5-gitops/argocd-hello-world-templates/chart/app/stable
            valuesFile: 5-gitops/argocd-values/app/hello-world.yaml
          - appName: garmin-mcp
            project: garmin
            chartPath: 5-gitops/argocd-garmin-templates/chart/app/stable
            valuesFile: 5-gitops/argocd-values/app/garmin-mcp-values.yaml
  template:
    metadata:
      name: hello-world
    spec:
      project: default
      source:
        repoURL: https://github.com/Jeongjuwon-259/hermes-order-k8s-flowise.git
        targetRevision: main
        path: 5-gitops/argocd-hello-world-templates/chart/app/stable
        helm:
          valueFiles:
            - 5-gitops/argocd-values/app/hello-world.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: hello-world
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: garmin-app-stack
  namespace: argocd
spec:
  generators:
    - list:
