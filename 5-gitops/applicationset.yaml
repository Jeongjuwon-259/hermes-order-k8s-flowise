# ⚠️ 초안 — 실기 검증 안 됨. ArgoCD 버전에 따라 Git file generator 템플릿 문법이
# 조금씩 다를 수 있어서, 실제 앱(예: flowise-values.yaml) 추가해서 sync 확인 전까지 신뢰하지 말 것.
#
# argocd-values/app/*.yaml 파일이 하나 생길 때마다 ArgoCD Application을 자동 생성.
# 차트(argocd-templates/chart/app/stable) + 매칭되는 값 파일을 조합해서 배포.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: app-stack
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/Jeongjuwon-259/hermes-order-k8s-flowise.git
        revision: main
        files:
          - path: "5-gitops/argocd-values/app/*.yaml"
  template:
    metadata:
      name: '{{.path.basenameNormalized}}'
    spec:
      project: default
      sources:
        - repoURL: https://github.com/Jeongjuwon-259/hermes-order-k8s-flowise.git
          targetRevision: main
          path: 5-gitops/argocd-templates/chart/app/stable
          helm:
            valueFiles:
              - $values/5-gitops/argocd-values/app/{{.path.basename}}
        - repoURL: https://github.com/Jeongjuwon-259/hermes-order-k8s-flowise.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.path.basenameNormalized}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
