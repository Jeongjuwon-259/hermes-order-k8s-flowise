# 5-gitops/applicationset.yaml
# argocd-values/app/*.yaml 파일이 하나 생길 때마다 ArgoCD Application을 자동 생성.
# 차트는 argocd-<project>-templates/chart/app/stable 에 있으므로, 각 파일에
# project: <project명> 필드를 넣어야 합니다.

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: app-stack
  namespace: argocd
spec:
  generators:
    # listMatches: 매칭된 파일의 content 파일을 template 파라미터로 제공
    - list:
        elements:
          - project: hello-world
            chartPath: 5-gitops/argocd-hello-world-templates/chart/app/stable
            valuesFile: 5-gitops/argocd-values/app/hello-world.yaml
          - project: garmin
            chartPath: 5-gitops/argocd-garmin-templates/chart/app/stable
            valuesFile: 5-gitops/argocd-values/app/garmin-mcp-values.yaml
  template:
    metadata:
      name: |-
        {{.project}}
    spec:
      project: default
      sources:
        - chart: garmin-mcp
          repoURL: https://github.com/Jeongjuwon-259/hermes-order-k8s-flowise.git
          targetRevision: main
          ref: values
        - repoURL: https://github.com/Jeongjuwon-259/hermes-order-k8s-flowise.git
          targetRevision: main
          path: |-
            {{.chartPath}}
          helm:
            valueFiles:
              - |-
                {{.valuesFile}}
      destination:
        server: https://kubernetes.default.svc
        namespace: |-
          {{.project}}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
