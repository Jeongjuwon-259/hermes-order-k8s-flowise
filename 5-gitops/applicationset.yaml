            valuesFile: 5-gitops/argocd-values/app/garmin-mcp-values.yaml
  template:
    metadata:
      name: garmin-mcp
    spec:
      project: default
      source:
        repoURL: https://github.com/Jeongjuwon-259/hermes-order-k8s-flowise.git
        targetRevision: main
        path: 5-gitops/argocd-garmin-templates/chart/app/stable
        helm:
          valueFiles:
            - 5-gitops/argocd-values/app/garmin-mcp-values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: garmin
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
