# 5-gitops/samples/hello-world/service.yaml
# NodePort로 LAN 어디서든 http://<노드IP>:30090 접속 가능
apiVersion: v1
kind: Service
metadata:
  name: hello-world
  namespace: hello-world
  labels:
    app: hello-world
spec:
  type: NodePort
  selector:
    app: hello-world
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30090
