# secret-docker.yaml/project-secret.yaml(평문 커밋)를 SealedSecret으로 대체 (README.md §10 결정 로그 참고)
# encryptedData는 Mac mini에서 kubeseal로 오프라인 생성한 값을 values 파일에 붙여넣는 방식
# (1-cluster/ansible/roles/sealed-secrets가 컨트롤러/공개키 설치)
{{- range .Values.sealedSecrets }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .name }}
spec:
  encryptedData:
    {{- toYaml .encryptedData | nindent 4 }}
  template:
    metadata:
      name: {{ .name }}
    type: {{ .type | default "Opaque" }}
{{- end }}
